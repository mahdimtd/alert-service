image: docker.arvancloud.ir/docker:latest

stages:
  - build
  - deploy

variables:
  IMAGE_NAME: $CI_REGISTRY/hems/services/analytics-pipeline/alert-service
  TAG: $CI_COMMIT_SHORT_SHA
  CONTAINER_NAME: homeiot-alert-service
  GIT_HOST: "192.168.140.41:8000"
  CI_REGISTRY: "192.168.140.41:5000"
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  COMPOSE_PROJECT_NAME: homeiot
  DEPLOY_DIR: /opt/homeiot/config/compose/alert-service

build:
  stage: build
  tags:
    - docker
  before_script:
    - git remote set-url origin http://$GIT_HOST/hems/services/analytics-pipeline/alert-service.git
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" http://$CI_REGISTRY
    - |
      docker build \
        --network host \
        --cache-from $IMAGE_NAME:latest \
        -f Dockerfile \
        -t $IMAGE_NAME:$TAG \
        -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$TAG
    - docker push $IMAGE_NAME:latest
  after_script:
    - docker logout http://$CI_REGISTRY || true

deploy:
  stage: deploy
  tags:
    - docker
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - apk add --no-cache gettext docker-compose
  script:
    # Pull the latest images
    - docker pull "$IMAGE_NAME:$TAG"
    - docker pull "$IMAGE_NAME:latest"

    # Create deployment directory if it doesn't exist
    - mkdir -p $DEPLOY_DIR
    
    # Copy docker-compose files to deployment directory
    - cp docker-compose.prod.yml $DEPLOY_DIR/docker-compose.yml
    - cp .env.template $DEPLOY_DIR/.env.template
    
    # Generate .env file with proper substitutions
    - cd $DEPLOY_DIR
    - export IMAGE_NAME="$IMAGE_NAME"
    - export TAG="$TAG"
    - envsubst < .env.template > .env
    
    # Deploy with docker-compose
    - |
      docker-compose down --remove-orphans || true
      
    - |
      IMAGE_NAME=$IMAGE_NAME TAG=$TAG docker-compose up -d
    
    # Check if all services are running
    - sleep 10
    - docker-compose ps
    
    # Show logs for debugging
    - docker-compose logs --tail=50

    # Verify all containers are running
    - |
      RUNNING=$(docker-compose ps --services --filter "status=running" | wc -l)
      TOTAL=$(docker-compose ps --services | wc -l)
      if [ "$RUNNING" -eq "$TOTAL" ]; then
        echo "All $TOTAL services are running successfully!"
        docker-compose ps
      else
        echo "Some services failed to start. Showing logs:"
        docker-compose logs
        exit 1
      fi

  # after_script:
  #   - docker logout http://$CI_REGISTRY || true
  #   - rm -f $DEPLOY_DIR/.env || true


