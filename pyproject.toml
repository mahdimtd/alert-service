[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alert-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiokafka>=0.14.0",
    "fastapi>=0.141.1",
    "psycopg2-binary>=2.9.12",
    "py-spy>=0.4.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.1",
]

[tool.setuptools.packages.find]
where = ["src"]